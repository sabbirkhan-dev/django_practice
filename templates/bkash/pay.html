{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bkash/pay.css' %}">
    <title>Payment</title>
</head>
<body>
    {% if pay %}
    <table class = "table-border">
        <tr>
            <th>ID</th>
            <th>Pay Option</th>
            <th>Min Pay</th>
            <th>Max Pay</th>
        </tr>
        {% for i in pay %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.pay_option}}</td>
            <td>{{i.min_pay}}</td>
            <td>{{i.max_pay}}</td>
        </tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>
